[pytest]
addopts = -p no:cacheprovider
testpaths = app/tests
# proxy/tests holds CTest end-to-end scripts that take positional arguments;
# pytest may import them (no collection errors) but must not recurse into them.
# The remaining patterns are pytest's defaults, which this setting replaces.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} proxy/tests
# A leaked SQLite connection must fail the run instead of only printing a
# warning. CPython ignores ResourceWarning by default, so the first filter is
# what turns the finalizer warning into an exception; pytest then re-warns that
# exception as PytestUnraisableExceptionWarning, which no ResourceWarning
# filter matches, so the second filter is required as well. Both only cover
# leaks that happen while pytest owns the unraisable hook; connections that are
# still alive at interpreter exit are invisible here and are covered by
# scripts/check_sqlite_leaks.py.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
