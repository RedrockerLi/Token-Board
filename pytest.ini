[pytest]
addopts = -p no:cacheprovider
testpaths = app/tests
# proxy/tests holds CTest end-to-end scripts that take positional arguments;
# pytest may import them (no collection errors) but must not recurse into them.
# The remaining patterns are pytest's defaults, which this setting replaces.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} proxy/tests
